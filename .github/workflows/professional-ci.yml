name: ExportHUB Professional CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'api/**'
      - 'shared/**'
      - 'schema/**'
      - 'migration/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'staticwebapp.config.json'
      - 'professional-project.json'
      - '.github/workflows/professional-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Professional repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Root files:"
          ls -la
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo_name,,}" != "exporthub-professional" ]]; then
            echo "::error::Falsches Repository. Erwartet: ExportHub-Professional, aktuell: $GITHUB_REPOSITORY"
            exit 1
          fi
          if [[ ! -f professional-project.json ]]; then
            echo "::error::professional-project.json fehlt am Repository-Root. Wahrscheinlich wurde der komplette Ordner statt seines Inhalts hochgeladen."
            echo "Gefundene Marker:"
            find . -maxdepth 4 -name professional-project.json -type f -print || true
            exit 1
          fi
          node - <<'NODE'
          const p=require('./professional-project.json');
          console.log('Project marker:', p);
          if(p.project!=='ExportHUB Professional') throw new Error('project marker mismatch');
          if(p.version!=='0.6.0') throw new Error(`version mismatch: expected 0.6.0, got ${p.version}`);
          NODE
          if [[ -f TESTVERSION.html || -f production-version.js ]]; then
            echo "::error::Internal-Dateien wurden im Professional-Repository gefunden (TESTVERSION.html/production-version.js)."
            exit 1
          fi
          echo "OK: ExportHUB Professional 0.6.0 repository identity"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Professional tests
        run: npm test
      - name: Install Professional API dependencies
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate Professional API runtime
        shell: bash
        run: |
          set -euo pipefail
          for f in api/health/index.js api/professional-meta/index.js api/shared/database.js api/shared/auth-security.js api/shared/auth-store.js api/shared/http.js api/auth-login/index.js api/auth-session/index.js api/auth-logout/index.js api/onboarding-status/index.js api/onboarding-create/index.js; do node --check "$f"; done
          cd api && node -e "require('./shared/database.js'); require('./shared/auth-security.js'); require('./shared/auth-store.js'); require('pg'); console.log('OK: Professional 0.6 API runtime loads');"
      - name: Verify no legacy source backup is committed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*backup*.json' -o -iname '*fehlerdiagnose*.json' \) ! -path './migration/sample-backup.json' | grep -q .; then
            echo 'FEHLER: Echtes Backup/Diagnosefile im Professional-Repository gefunden.'
            exit 1
          fi
