name: ExportHUB Professional CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'api/**'
      - 'shared/**'
      - 'schema/**'
      - 'migration/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'staticwebapp.config.json'
      - 'professional-project.json'
      - '.github/workflows/professional-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Professional repository identity
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo_name,,}" != "exporthub-professional" ]]; then
            echo "::error::Falsches Repository: $GITHUB_REPOSITORY. Erwartet: ExportHub-Professional."
            exit 1
          fi
          if [[ ! -f professional-project.json ]]; then
            echo "::error::professional-project.json fehlt am Repository-Root. Bitte den Inhalt des Professional-Pakets direkt ins Repository-Root hochladen."
            find . -maxdepth 4 -name professional-project.json -type f -print || true
            exit 1
          fi
          node - <<'NODE'
          const p=require('./professional-project.json');
          if(p.project!=='ExportHUB Professional') throw new Error('project marker mismatch');
          if(p.version!=='0.7.0') throw new Error(`version mismatch: expected 0.7.0, got ${p.version}`);
          console.log('OK: ExportHUB Professional 0.7.0 repository identity');
          NODE
          if [[ -f TESTVERSION.html || -f production-version.js ]]; then
            echo "::error::ExportHUB-Internal-Dateien wurden im Professional-Repository gefunden."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Professional tests
        run: npm test
      - name: Install Professional API dependencies
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate Professional API runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            api/health/index.js api/professional-meta/index.js
            api/shared/database.js api/shared/auth-security.js api/shared/auth-store.js api/shared/authorization.js api/shared/user-admin-store.js api/shared/http.js
            api/auth-login/index.js api/auth-session/index.js api/auth-logout/index.js api/onboarding-status/index.js api/onboarding-create/index.js
            api/admin-users-list/index.js api/admin-user-invite/index.js api/admin-user-role/index.js api/admin-user-status/index.js api/admin-password-reset/index.js api/admin-identity-audit/index.js
            api/invite-redeem/index.js api/password-reset-redeem/index.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          cd api
          node -e "require('./shared/database.js'); require('./shared/auth-security.js'); require('./shared/auth-store.js'); require('./shared/authorization.js'); require('./shared/user-admin-store.js'); require('pg'); console.log('OK: Professional 0.7 API runtime loads');"
      - name: Verify no legacy source backup is committed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*backup*.json' -o -iname '*fehlerdiagnose*.json' \) ! -path './migration/sample-backup.json' | grep -q .; then
            echo 'FEHLER: Echtes Backup/Diagnosefile im Professional-Repository gefunden.'
            exit 1
          fi
