name: ExportHUB Professional CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'api/**'
      - 'shared/**'
      - 'schema/**'
      - 'migration/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'staticwebapp.config.json'
      - 'professional-project.json'
      - '.github/workflows/professional-ci.yml'
      - '.github/workflows/professional-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'api/**'
      - 'shared/**'
      - 'schema/**'
      - 'migration/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'staticwebapp.config.json'
      - 'professional-project.json'
      - '.github/workflows/professional-ci.yml'
      - '.github/workflows/professional-deploy.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Professional repository identity
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo_name,,}" != "exporthub-professional" ]]; then
            echo "::error::Falsches Repository: $GITHUB_REPOSITORY. Erwartet: ExportHub-Professional."
            exit 1
          fi
          if [[ ! -f professional-project.json ]]; then
            echo "::error::professional-project.json fehlt am Repository-Root. Bitte den Inhalt des Professional-Pakets direkt ins Repository-Root hochladen."
            find . -maxdepth 4 -name professional-project.json -type f -print || true
            exit 1
          fi
          node - <<'NODE'
          const p=require('./professional-project.json');
          if(p.project!=='ExportHUB Professional') throw new Error('project marker mismatch');
          if(p.version!=='0.7.0') throw new Error(`version mismatch: expected 0.7.0, got ${p.version}`);
          console.log('OK: ExportHUB Professional 0.7.0 repository identity');
          NODE
          if [[ -f TESTVERSION.html || -f production-version.js ]]; then
            echo "::error::ExportHUB-Internal-Dateien wurden im Professional-Repository gefunden."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Professional tests
        run: npm test
      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/locations.js
          node --check assets/js/ui-kit.js
          node --check assets/js/operations.js
          node --check assets/js/operations-write.js
          node --check assets/js/overview.js
      - name: Verify Logistics Control Center invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('assets/js/app.js','utf8');
          const loc=fs.readFileSync('assets/js/locations.js','utf8');
          const operations=fs.readFileSync('assets/js/operations.js','utf8');
          const writes=fs.readFileSync('assets/js/operations-write.js','utf8');
          const overview=html.match(/<section class="view active" data-view="overview">([\s\S]*?)<section class="view" data-view="migration">/)?.[1]||'';
          if(/class="hero"/.test(overview)) throw new Error('legacy overview hero still present');
          for(const id of ['overviewOpenShipments','overviewPickupsToday','overviewMissingDocuments']){
            if(new RegExp(`id="${id}"[^>]*>\\s*0\\s*<`).test(overview)) throw new Error(`fake zero metric: ${id}`);
          }
          if(/deleteCustomer|deleteLocation|Kunde löschen|Standort löschen/i.test(app+loc)) throw new Error('hard-delete UI introduced');
          if(/method:\s*['"]POST['"]/.test(loc)) throw new Error('duplicate location editor mutation introduced');
          if(/method\s*:\s*['"](?:POST|PUT|PATCH|DELETE)/i.test(operations)) throw new Error('read-only operations frontend contains mutation method');
          if(!/operations-write\.js/.test(operations)) throw new Error('optional write enhancement is not linked from operations runtime');
          if(!/\/api\/professional-meta/.test(writes)||!/writesEnabled/.test(writes)) throw new Error('operational write gate is not sourced from Professional meta');
          if(!/x-professional-csrf/i.test(writes)) throw new Error('operational mutation CSRF header missing');
          if(/tenantId\s*:/.test(writes)) throw new Error('browser attempted to provide tenant scope');
          if(/PROFESSIONAL_ENABLE_WRITES\s*=|PROFESSIONAL_DATA_MODE\s*=/.test(writes)) throw new Error('frontend attempted to alter environment gates');
          if(!/method:\s*['"]POST['"]/.test(writes)||!/method:\s*['"]PATCH['"]/.test(writes)) throw new Error('expected gated operational mutation methods missing');
          console.log('OK: read-only runtime preserved; isolated operational writes remain meta-gated, role-aware, CSRF-protected and tenant-free in browser payloads');
          NODE
      - name: Install Professional API dependencies
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate Professional API runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            api/health/index.js api/professional-meta/index.js
            api/shared/database.js api/shared/auth-security.js api/shared/auth-store.js api/shared/authorization.js api/shared/user-admin-store.js api/shared/http.js
            api/shared/masterdata-validation.js api/shared/masterdata-store.js api/shared/operations-store.js api/shared/operations-write-store.js api/shared/tasks-store.js
            api/auth-login/index.js api/auth-session/index.js api/auth-logout/index.js api/onboarding-status/index.js api/onboarding-create/index.js
            api/admin-users-list/index.js api/admin-user-invite/index.js api/admin-user-role/index.js api/admin-user-status/index.js api/admin-password-reset/index.js api/admin-identity-audit/index.js
            api/invite-redeem/index.js api/password-reset-redeem/index.js
            api/masterdata-customers/index.js api/masterdata-customer/index.js api/masterdata-customer-status/index.js api/masterdata-customer-locations/index.js
            api/masterdata-location/index.js api/masterdata-location-status/index.js api/masterdata-locations/index.js
            api/operations-summary/index.js api/operations-shipments/index.js api/operations-documents/index.js api/operations-tasks/index.js
            api/tasks-list/index.js api/task-create/index.js api/task-status/index.js api/shipment-create/index.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          cd api
          node -e "require('./shared/database.js'); require('./shared/auth-security.js'); require('./shared/auth-store.js'); require('./shared/authorization.js'); require('./shared/user-admin-store.js'); require('./shared/masterdata-validation.js'); require('./shared/masterdata-store.js'); require('./shared/operations-store.js'); require('./shared/operations-write-store.js'); require('./shared/tasks-store.js'); require('pg'); console.log('OK: Professional 0.7 API runtime loads');"
      - name: Verify no legacy source backup is committed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*backup*.json' -o -iname '*fehlerdiagnose*.json' \) ! -path './migration/sample-backup.json' | grep -q .; then
            echo 'FEHLER: Echtes Backup/Diagnosefile im Professional-Repository gefunden.'
            exit 1
          fi
