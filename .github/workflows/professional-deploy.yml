name: ExportHUB Professional Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ExportHUB Professional CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: exporthub-professional-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Re-run Professional tests before deploy
        run: npm test

      - name: Install API dependencies for validation
        run: npm install --prefix api --ignore-scripts --no-audit --no-fund

      - name: Validate API runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -f api/host.json
          node -e "const c=require('./staticwebapp.config.json'); if(c.platform?.apiRuntime!=='node:20') process.exit(1); console.log('OK: Azure API runtime node:20');"
          cd api
          node -e "require('./shared/database.js'); require('./shared/auth-security.js'); require('./shared/auth-store.js'); require('./shared/authorization.js'); require('./shared/user-admin-store.js'); require('./shared/masterdata-schema.js'); require('./shared/masterdata-store.js'); require('./shared/shipment-schema.js'); require('./shared/shipment-domain.js'); require('./shared/shipment-calculations.js'); require('./shared/shipment-read-model.js'); require('./shared/shipment-store.js'); require('./shared/workspace-settings-store.js'); require('pg'); console.log('OK: Professional API runtime loads');"

      - name: Prepare public frontend payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy/shared
          cp index.html staticwebapp.config.json .deploy/
          cp -R assets .deploy/assets
          cp shared/migration-core.js .deploy/shared/migration-core.js
          test -f .deploy/index.html
          test -f .deploy/staticwebapp.config.json
          test -f .deploy/assets/js/app.js
          test -f .deploy/assets/js/ui-kit.js
          test -f .deploy/assets/js/overview.js
          test -f .deploy/assets/js/workspace-settings.js
          test -f .deploy/assets/js/shipment-autosave.js
          test -f .deploy/assets/js/shipment-editor.js
          test -f .deploy/assets/js/shipments.js
          test -f .deploy/assets/css/app.css
          test -f .deploy/assets/css/control-center.css
          test -f .deploy/shared/migration-core.js
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const files=['.deploy/assets/js/app.js','.deploy/assets/js/shipments.js'];
          let imports=[];
          for(const file of files){
            const source=fs.readFileSync(file,'utf8');
            imports.push(...[...source.matchAll(/(?:from\s+|import\s*)['"]([^'"]+)['"]/g)].map(m=>({file,spec:m[1]})).filter(x=>x.spec.startsWith('.')));
          }
          for(const {file,spec} of imports){
            const target=path.resolve(path.dirname(file),spec);
            if(!fs.existsSync(target)){
              console.error(`Missing frontend module in deploy payload: ${spec} -> ${target}`);
              process.exit(1);
            }
          }
          console.log(`OK: ${imports.length} relative frontend import(s) are present in deploy payload`);
          NODE

      - name: Verify Azure deployment token
        shell: bash
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ -z "${AZURE_STATIC_WEB_APPS_API_TOKEN}" ]]; then
            echo "::error::Repository-Secret AZURE_STATIC_WEB_APPS_API_TOKEN fehlt. In Azure Static Web Apps den Deployment Token kopieren und in GitHub unter Settings > Secrets and variables > Actions hinterlegen."
            exit 1
          fi

      - name: Build and deploy ExportHUB Professional
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: .deploy
          api_location: api
          output_location: ''
          skip_app_build: true
