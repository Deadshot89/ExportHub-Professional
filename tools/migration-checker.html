<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExportHUB Professional 0.4 Migration Checker</title><style>body{font:15px Segoe UI,Arial;background:#f4f7fb;color:#142a42;margin:0;padding:24px}.box{max-width:920px;margin:auto;background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:22px}h1{margin-top:0}.muted{color:#64798e}.good{background:#e9f8ef;color:#175e3a;padding:12px;border-radius:10px}.bad{background:#fff0f0;color:#902c2c;padding:12px;border-radius:10px}.warn{background:#fff8e5;color:#765300;padding:12px;border-radius:10px}button,input{padding:10px 12px;border-radius:9px}button{border:0;background:#0e6193;color:#fff;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.row input{border:1px solid #cad7e4}pre{white-space:pre-wrap;background:#f5f8fc;padding:12px;border-radius:10px;max-height:420px;overflow:auto}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>ExportHUB Professional 0.4 – Migration Checker</h1><p class="muted">Lokales Prüfwerkzeug. Es lädt keine Daten ins Internet und schreibt nichts in ExportHUB Internal.</p><div class="row"><input id="version" placeholder="Quellversion bei Legacy-Backup, z. B. RC826"><input id="tenant" placeholder="Mandantenname"></div><input id="file" type="file" accept=".json"><button id="run">Prüfen</button><div id="out" style="margin-top:16px"></div></div><script type="module">import{buildMigrationPackage,summarizePackage}from'../shared/migration-core.js';let file=null;document.getElementById('file').onchange=e=>file=e.target.files[0];document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');if(!file){out.className='bad';out.textContent='Bitte Backup auswählen.';return}out.className='warn';out.textContent='Prüfung läuft …';try{const text=await file.text(),pkg=await buildMigrationPackage(JSON.parse(text),text,{sourceVersionHint:document.getElementById('version').value.trim(),tenantNameHint:document.getElementById('tenant').value.trim()}),s=summarizePackage(pkg);out.className=pkg.manifest.gates.readOnlyReady?'good':'bad';out.innerHTML='<b>'+(pkg.manifest.gates.readOnlyReady?'READ_ONLY_READY':'BLOCKIERT')+'</b><pre>'+JSON.stringify({summary:s,statusCounts:pkg.manifest.statusCounts,podFiles:{entries:pkg.manifest.sourceCounts.podFileEntries,inline:pkg.manifest.sourceCounts.podFileInline,remote:pkg.manifest.sourceCounts.podFileRemote,metadataOnly:pkg.manifest.sourceCounts.podFileMetadataOnly},gates:pkg.manifest.gates,documents:pkg.manifest.documents,podGate:pkg.manifest.documents.podGate,sourceSha256:pkg.manifest.sourceSha256,security:pkg.manifest.security},null,2)+'</pre>'}catch(e){out.className='bad';out.textContent=e.message||e}};</script></body></html>
